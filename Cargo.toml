[package]
name = "genact"
description = "A nonsense activity generator"
version = "1.6.0"
repository = "https://github.com/svenstaro/genact"
authors = ["Sven-Hendrik Haase <svenstaro@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["fake", "nonsense", "useless"]
categories = ["command-line-utilities", "command-line-interface"]
edition = "2024"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1

# We can't set strip = true because of https://github.com/rust-lang/rust/issues/93294
strip = "debuginfo"

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
chrono = { version = "0.4", features = ["clock", "wasmbind"], default-features = false }
fake = { version = "5.0", features = ["chrono"] }
colorgrad = { version = "0.9", features = ["preset"] }
humansize = "2"
humantime = "2"
instant = { version = "0.1", features = ["now", "wasm-bindgen"] }
progress_string = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = "0.10"
rand_distr = "0.6"
regex = "1.12"
sha2 = "0.11.0"
hex = "0.4"
yansi = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
ctrlc = { version = "3.5", features = ["termination"] }
terminal_size = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
url = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }

# `keepawake` only supports these platforms
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
keepawake = "0.6.0"

# `cargo deb --no-build` and `cargo generate-rpm` are run in CI after `target/assets/` is filled with
# the man page and shell completions (see .github/workflows/build-release.yml)
[package.metadata.deb]
section = "utils"
extended-description = "Pretend to be busy or waiting for your computer when you should actually be doing real work!"
assets = [
    ["target/release/genact", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/genact/", "644"],
    ["target/assets/genact.1.gz", "usr/share/man/man1/", "644"],
    ["target/assets/genact.bash", "usr/share/bash-completion/completions/genact", "644"],
    ["target/assets/_genact", "usr/share/zsh/vendor-completions/", "644"],
    ["target/assets/genact.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.generate-rpm]
auto-req = "no"
assets = [
    { source = "target/release/genact", dest = "/usr/bin/genact", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/genact/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/genact/README.md", mode = "644", doc = true },
    { source = "target/assets/genact.1.gz", dest = "/usr/share/man/man1/genact.1.gz", mode = "644", doc = true },
    { source = "target/assets/genact.bash", dest = "/usr/share/bash-completion/completions/genact", mode = "644" },
    { source = "target/assets/_genact", dest = "/usr/share/zsh/site-functions/_genact", mode = "644" },
    { source = "target/assets/genact.fish", dest = "/usr/share/fish/vendor_completions.d/genact.fish", mode = "644" },
]
